<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINISTER WEB Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
padding:15px;
}
header{
font-size:24px;
font-weight:bold;
padding:15px 0;
color:#7c8cff;
}
.container{
max-width:900px;
margin:auto;
}
.card{
background:#151e33;
padding:20px;
border-radius:15px;
margin:15px 0;
}
input,textarea,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #33415f;
border-radius:8px;
background:#0b1325;
color:white;
}
button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#6575ff;
color:white;
font-weight:bold;
margin:5px 0;
cursor:pointer;
}
.delete{background:#e63946}
.edit{background:#168aad}
.logout{background:#333}
.hidden{display:none}
.product{
background:#202c45;
padding:15px;
border-radius:10px;
margin:10px 0;
}
img{
max-width:100%;
height:120px;
object-fit:contain;
}
</style>
</head>

<body>
<div class="container">

<header>SINISTER WEB | ADMIN</header>

<div id="loginBox" class="card">
<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Admin Gmail">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">LOGIN</button>

<p id="message"></p>
</div>

<div id="adminBox" class="hidden">

<div class="card">
<h2>Admin Dashboard</h2>
<p id="adminEmail"></p>
<button class="logout" onclick="logout()">LOGOUT</button>
</div>

<div class="card">
<h2 id="formTitle">Add Product</h2>

<input id="productId" type="hidden">

<input id="name" placeholder="Product Name">

<textarea id="description" placeholder="Product Description"></textarea>

<input id="price" type="number" placeholder="Price ₹">

<input id="comparePrice" type="number" placeholder="Compare Price ₹">

<input id="category" placeholder="Category">

<input id="stock" type="number" placeholder="Stock">

<input id="image" type="url" placeholder="Product Image URL">

<label>
<input id="active" type="checkbox" checked>
Product Active
</label>

<br>

<button onclick="saveProduct()">SAVE PRODUCT</button>

<button class="logout" onclick="clearForm()">CANCEL</button>

</div>

<div class="card">
<h2>Manage Products</h2>
<button onclick="loadProducts()">REFRESH</button>
<div id="products"></div>
</div>

</div>
</div>

<script>
const SUPABASE_URL =
"https://jwdlexjywqujaovmwwec.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XRihYuOlbo5UcoQTTN6tfw_lIaxIXzG";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const msg = document.getElementById("message");

msg.innerText = "Logging in...";

const {data,error} =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){
msg.innerText = error.message;
return;
}

currentUser = data.user;

const {data:admin,error:adminError} =
await db.from("admin_users")
.select("user_id")
.eq("user_id",currentUser.id)
.maybeSingle();

if(adminError || !admin){

await db.auth.signOut();

msg.innerText = "You are not an authorized admin.";
return;
}

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("adminBox").classList.remove("hidden");

document.getElementById("adminEmail").innerText =
currentUser.email;

loadProducts();
}

async function logout(){

await db.auth.signOut();

location.reload();
}

async function loadProducts(){

const {data,error} =
await db.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){
alert(error.message);
return;
}

const container = document.getElementById("products");

container.innerHTML = "";

data.forEach(product=>{

const div = document.createElement("div");

div.className = "product";

div.innerHTML = `
<h3>${escapeHTML(product.name)}</h3>

<p>Price: ₹${product.price}</p>

<p>Category: ${escapeHTML(product.category || "")}</p>

<p>Stock: ${product.stock}</p>

<p>Status: ${product.is_active ? "Active" : "Hidden"}</p>

<button class="edit" onclick="editProduct('${product.id}')">
EDIT
</button>

<button class="delete" onclick="deleteProduct('${product.id}')">
DELETE
</button>
`;

container.appendChild(div);
});
}

async function saveProduct(){

const id = document.getElementById("productId").value;

const product = {

name:document.getElementById("name").value,

description:document.getElementById("description").value,

price:Number(document.getElementById("price").value),

compare_price:Number(document.getElementById("comparePrice").value || 0),

category:document.getElementById("category").value,

stock:Number(document.getElementById("stock").value || 0),

is_active:document.getElementById("active").checked
};

if(!product.name || product.price < 0){
alert("Please enter valid product details.");
return;
}

let result;

if(id){

result = await db.from("products")
.update(product)
.eq("id",id);

}else{

result = await db.from("products")
.insert(product);
}

if(result.error){

alert(result.error.message);

return;
}

const imageURL = document.getElementById("image").value.trim();

if(imageURL && !id){

const {data:newProduct} = await db.from("products")
.select("id")
.eq("name",product.name)
.order("created_at",{ascending:false})
.limit(1)
.maybeSingle();

if(newProduct){

const imageResult = await db.from("product_images")
.insert({
product_id:newProduct.id,
image_url:imageURL,
sort_order:0
});

if(imageResult.error){
alert("Product saved, but image could not be saved: " + imageResult.error.message);
}
}
}

alert("Product saved successfully!");

clearForm();

loadProducts();
}

async function editProduct(id){

const {data,error} =
await db.from("products")
.select("*")
.eq("id",id)
.single();

if(error){
alert(error.message);
return;
}

document.getElementById("productId").value = data.id;

document.getElementById("name").value = data.name;

document.getElementById("description").value = data.description || "";

document.getElementById("price").value = data.price;

document.getElementById("comparePrice").value = data.compare_price || 0;

document.getElementById("category").value = data.category || "";

document.getElementById("stock").value = data.stock || 0;

document.getElementById("active").checked = data.is_active;

document.getElementById("formTitle").innerText = "Edit Product";

window.scrollTo(0,0);
}

async function deleteProduct(id){

if(!confirm("Are you sure you want to delete this product?")){
return;
}

const {error} =
await db.from("products")
.delete()
.eq("id",id);

if(error){
alert(error.message);
return;
}

alert("Product deleted!");

loadProducts();
}

function clearForm(){

document.getElementById("productId").value = "";

document.getElementById("name").value = "";

document.getElementById("description").value = "";

document.getElementById("price").value = "";

document.getElementById("comparePrice").value = "";

document.getElementById("category").value = "";

document.getElementById("stock").value = "";

document.getElementById("image").value = "";

document.getElementById("active").checked = true;

document.getElementById("formTitle").innerText = "Add Product";
}

function escapeHTML(value){
return String(value ?? "").replace(/[&<>"']/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

async function checkSession(){

const {data:{session}} = await db.auth.getSession();

if(session){

currentUser = session.user;

const {data:admin} =
await db.from("admin_users")
.select("user_id")
.eq("user_id",currentUser.id)
.maybeSingle();

if(admin){

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("adminBox").classList.remove("hidden");

document.getElementById("adminEmail").innerText =
currentUser.email;

loadProducts();
}
}
}

checkSession();
</script>

</body>
  </html>
